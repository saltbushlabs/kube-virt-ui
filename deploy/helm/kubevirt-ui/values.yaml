image:
  repository: ghcr.io/saltbushlabs/kube-virt-ui
  tag: ""          # defaults to .Chart.AppVersion; published for each v* git tag
  pullPolicy: IfNotPresent

# External URL users reach the UI on. Used to build invite links.
publicURL: https://vms.example.com

# Name of an existing Secret in the release namespace with key `secret-key`
# (32 random bytes, base64-encoded, e.g. from `openssl rand -base64 32`).
#
# REQUIRED when deploying via GitOps (ArgoCD, Flux) or `helm template`:
# The chart's default Secret template uses Helm's `lookup` function to preserve
# the generated key across upgrades. Under `helm template` (used by ArgoCD,
# Flux template pipelines, and CI render workflows), `lookup` always returns
# empty, so every render/sync generates a new `secret-key` and overwrites the
# Secret (`helm.sh/resource-policy: keep` does not stop `kubectl apply` or
# ArgoCD from updating Secret data). Rotating or losing this key makes all
# stored TOTP secrets undecryptable, permanently locking users out of login.
#
# Leave empty only for direct `helm install`/`helm upgrade` workflows (and back
# up the generated `<release>-key` Secret).
existingSecret: ""

# Namespace CDI is installed in. The backend streams image uploads to its
# cdi-uploadproxy service and reads the proxy's CA bundle from there.
cdi:
  namespace: cdi

persistence:
  size: 1Gi
  storageClassName: ""   # empty uses the cluster default

# CIDRs of reverse proxies whose X-Forwarded-For header is believed, i.e.
# the ingress controller's pods (Talos default pod CIDR: 10.244.0.0/16).
# Required with ingress.enabled. Login and invite rate limits, and the
# audit log, use the client address this yields. Anything that can connect
# from these ranges can claim any client address, so keep them narrow.
trustedProxies: []

# Restrict what the backend's ServiceAccount may do with its cluster-wide
# RBAC (see templates/admission-policy.yaml). Needs Kubernetes 1.30+.
admissionPolicy:
  enabled: true

ingress:
  enabled: false
  className: ""
  host: vms.example.com
  tlsSecretName: ""
  # Image uploads are large, single requests. With ingress-nginx, allow them:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
  #   nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
