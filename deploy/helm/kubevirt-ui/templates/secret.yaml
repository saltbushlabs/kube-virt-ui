{{/*
Auto-generated TOTP encryption key Secret (rendered only when .Values.existingSecret is empty).

WARNING (GitOps / helm template):
Helm's `lookup` function always returns an empty map during `helm template`
(used by ArgoCD, Flux template pipelines, and CI render workflows). Every
render/sync therefore falls back to `randBytes 32` and generates a brand-new
`secret-key`. `helm.sh/resource-policy: keep` only prevents deletion on
`helm uninstall`; it does NOT stop `kubectl apply` or GitOps controllers from
overwriting the Secret's data, which makes all stored TOTP secrets
undecryptable and permanently locks users out of two-factor login.

For GitOps (ArgoCD, Flux) or `helm template` deployments, pre-create the Secret
out-of-band (or via External Secrets / Sealed Secrets) with key `secret-key`
(32 random bytes, base64-encoded) and set `existingSecret` so this template is
skipped.
*/}}
{{- if not .Values.existingSecret }}
{{- $name := include "kvui.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingKey := "" }}
{{- if and $existing $existing.data }}
  {{- if hasKey $existing.data "secret-key" }}
    {{- $existingKey = index $existing.data "secret-key" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kvui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # TOTP secrets are encrypted with this key
type: Opaque
data:
  {{- if $existingKey }}
  secret-key: {{ $existingKey }}
  {{- else }}
  # randBytes already returns base64; encode again for the data field.
  secret-key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
